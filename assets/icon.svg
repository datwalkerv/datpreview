  </defs>

  <!-- macOS icon grid: 824pt squircle on a 1024 canvas -->
  <rect x="100" y="112" width="824" height="824" rx="186" fill="#000000" fill-opacity="0.45" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- [ picture ] -->
